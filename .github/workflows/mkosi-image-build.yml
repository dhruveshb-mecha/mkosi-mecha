name: mkosi Fedora 43 build

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"   # daily at 02:00 UTC   # daily at 02:00 UTC  

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    container:
      image: fedora:43
      options: --privileged

    steps:
      - name: Install prerequisites
        run: |
          dnf -y update
          dnf -y install \
            mkosi \
            systemd \
            systemd-repart \
            git \
            wget \
            util-linux \
            e2fsprogs \
            dosfstools \
            squashfs-tools \
            xz \
            tar

      - name: Clone mkosi-mecha
        run: |
          git clone https://github.com/dhruveshb-mecha/mkosi-mecha /opt/mecha

      - name: Download custom packages
        working-directory: /opt/mecha
        run: |
          wget https://pub-a2f44c787cec4290833312e57fd59522.r2.dev/kernel-6.12.20%2Bmecha%2B-2.aarch64.rpm
          wget https://pub-a2f44c787cec4290833312e57fd59522.r2.dev/firmware-nxp-wifi-nxpiw612.fc43.aarch64.rpm

      - name: Build image with mkosi
        working-directory: /opt/mecha
        run: |
          mkosi -f build

      - name: Rename image with timestamp
        run: |
          TS=$(date -u +"%Y%m%d-%H%M")
          mv /opt/mecha/fedora43.raw /opt/mecha/mechanix-os-${TS}.raw
          echo "IMAGE_NAME=mechanix-os-${TS}.raw" >> $GITHUB_ENV

      - name: Upload mkosi image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}
          path: |
            /opt/mecha/${{ env.IMAGE_NAME }}
