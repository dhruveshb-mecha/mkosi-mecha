[Distribution]
Distribution=fedora
Release=43
Architecture=arm64

[Output]
Format=disk
Output=fedora43
SectorSize=512
CompressOutput=no

[Content]
Bootable=yes
Autologin=yes
Hostname=comet
UnifiedKernelImages=no
Devicetree=freescale/imx8mp-mecha-comet.dtb
RootPassword=mecha
PostInstallationScripts=mkosi.postinst

# include kernel and dracut so /boot has kernel + initramfs
Packages=
    NetworkManager
    accountsservice
    bash
    bash-completion
    coreutils
    cpufrequtils
    cryptsetup
    cuarzo-louvre
    cuarzo-louvre-examples
    curl
    dhclient
    dhcpcd
    dnf
    dracut
    dracut-network
    evtest
    fedora-release
    greetd
    gsettings-desktop-schemas
    i2c-tools
    iproute
    iw
    kernel
    kernel-tools
    libgpiod-utils
    lvm2
    mechanix-notes
    mechanix-settings
    mesa-demos
    mesa-dri-drivers
    mesa-vulkan-drivers
    mutter
    nano
    net-tools
    openssh-server
    passwd
    phoc
    plymouth
    seatd
    sudo
    systemd
    systemd-boot-unsigned
    usbutils
    util-linux
    vim
    weston
    weston-demo
    wget
    wpa_supplicant
    xorg-x11-server-Xwayland

PackageDirectories=/opt/mecha
Packages=
    kernel-6.12.20+mecha+-4.aarch64
    firmware-nxp-wifi-nxpiw612.fc43.aarch64.rpm
